<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Башня на Шпалерной</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
  /* стиль презентаций интенсива (presentations/lessonNN/src/style.css, тёмная тема): живой фон field.js + полупрозрачные карточки */
  :root {
    --ink: #fff; --muted: #b3b0b0; --surface: rgba(255, 255, 255, .08);
    --blue: #4d61f4; --blue-ink: #a9b4ff; --blue-soft: rgba(124, 140, 255, .26);
    --bad: #e5484d; --bad-ink: #ff9b9b; --bad-soft: rgba(255, 107, 107, .22);
    --card: rgba(46, 40, 40, .86); --card-line: rgba(255, 255, 255, .10); --card-shadow: 0 18px 50px rgba(0, 0, 0, .45);
    --head: 'Unbounded', 'Arial Black', sans-serif; --text: 'Inter Tight', Arial, sans-serif;
    --t: .38s cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #161010; }
  body { color: var(--ink); font: 400 17px/1.5 var(--text); }
  .field { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  main { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  .title { font-family: var(--head); font-weight: 600; text-transform: uppercase; line-height: 1.06; margin: 0 0 24px;
    font-size: clamp(26px, 7.5vw, 44px); hyphens: auto; overflow-wrap: break-word; }
  /* ponytail: без backdrop-filter, как в уроках: размытие поверх холста, который перерисовывается каждый кадр, тяжело для телефона */
  .card { background: var(--card); border-radius: 28px; padding: 28px 24px; box-shadow: var(--card-shadow), inset 0 0 0 1px var(--card-line);
    animation: rise .5s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  .question { font-size: 21px; font-weight: 600; line-height: 1.3; margin: 0 0 20px; }
  .muted { color: var(--muted); font-size: 15px; }
  button { font: 500 17px/1.35 var(--text); width: 100%; text-align: left; padding: 16px 20px; margin: 0 0 12px;
    border: none; border-radius: 20px; background: var(--surface); color: var(--ink); cursor: pointer;
    transition: background-color var(--t), box-shadow var(--t), opacity var(--t), transform .2s; }
  button:hover:not(:disabled) { background: rgba(255, 255, 255, .14); }
  button:focus-visible { outline: 3px solid var(--blue-ink); outline-offset: 2px; }
  button:disabled { cursor: default; opacity: .5; }
  button.right, button.wrong { opacity: 1; }
  button.right { background: var(--blue); color: #fff; }
  button.wrong { background: var(--bad-soft); box-shadow: 0 0 0 3px var(--bad); }
  .primary { background: var(--blue); color: #fff; border-radius: 999px; text-align: center; font-weight: 600; padding: 15px 32px; margin: 16px 0 0; }
  .primary:hover:not(:disabled) { background: var(--blue); transform: scale(.98); }
  .verdict { font-family: var(--head); font-weight: 600; text-transform: uppercase; font-size: 20px; line-height: 1.2; margin: 12px 0 8px; }
  .verdict.ok { color: var(--blue-ink); } .verdict.no { color: var(--bad-ink); }
  .verdict span { display: block; font: 600 17px/1.4 var(--text); text-transform: none; color: var(--ink); margin-top: 6px; }
  a { color: var(--blue-ink); font-weight: 600; }
  .score { font-family: var(--head); font-weight: 600; font-size: 56px; line-height: 1; color: var(--blue-ink); margin: 0 0 16px; }
</style>
</head>
<body>
<main aria-live="polite">
  <h1 class="title" id="title"></h1>
  <div class="card" id="app"></div>
</main>
<script src="field.js"></script>
<script>
// ponytail: факты только из context/architecture/03-данные/пул-фактов.md, тексты здесь же, без отдельного файла
const ENC = "https://encspb.ru/object/2855745571";
const QUESTIONS = [
  {
    q: "В какие годы построили водонапорную башню на Шпалерной?",
    options: ["1830–1832", "1859–1861", "1881–1883", "1903–1905"],
    answer: 1,
    note: "Башню построили в 1859–1861 годах. Всю Главную водопроводную станцию строили дольше: с 1858 по 1863 год.",
    source: { title: "Энциклопедия СПб, статья «Водонапорные башни» (раздел «Статьи» на странице)", url: ENC },
  },
  {
    q: "Для чего строили эту башню?",
    options: ["Как пожарную каланчу", "Как маяк для судов на Неве",
      "Для работы первого в Петербурге централизованного водопровода"],
    answer: 2,
    note: "Башня входила в Главную водопроводную станцию и строилась, чтобы работал первый в Петербурге централизованный водопровод.",
    source: { title: "Энциклопедия СПб, статья о Э. Г. Шуберском", url: ENC },
  },
  {
    q: "Какая форма у башни?",
    options: ["Круглая", "Квадратная", "Шестигранная", "Восьмигранная"],
    answer: 3,
    note: "Энциклопедия описывает её так: «восьмигранная башня из красного кирпича».",
    source: { title: "Энциклопедия СПб, статья «Водонапорные башни» (раздел «Статьи» на странице)", url: ENC },
  },
  {
    q: "Какова высота башни?",
    options: ["22 метра", "52,5 метра", "80 метров"],
    answer: 1,
    note: "Высота башни — 52,5 метра.",
    source: { title: "Энциклопедия СПб, статья «Водонапорные башни» (раздел «Статьи» на странице)", url: ENC },
  },
  {
    q: "Кто составил проект башни?",
    options: [
      "Архитектор Эрнест Шуберский, один, без помощников",
      "Иван Мерц, помощник архитектора Эрнеста Шуберского",
      "Иван Мерц, а Шуберский к башне отношения не имел",
    ],
    answer: 1,
    note: "По должности архитектором был Шуберский, а проект составлял его помощник Мерц. Журнал «Зодчий» в 1878 году писал, что башня «по праву, должна быть признана произведением Ивана Александровича» — но это мнение коллег Мерца, а не документ.",
    source: { title: "«Зодчий», 1878, с. 84 (скан РНБ)", url: "https://vivaldi.nlr.ru/pm000050193/view/#page=95" },
  },
  {
    q: "Элементы каких сооружений использованы в оформлении башни?",
    options: ["Античных храмов", "Средневековых оборонительных сооружений", "Русского деревянного зодчества"],
    answer: 1,
    note: "В оформлении башни использованы элементы средневековых фортификационных сооружений.",
    source: { title: "Энциклопедия СПб, статья о Э. Г. Шуберском", url: ENC },
  },
  {
    q: "Когда башня перестала работать как водонапорная?",
    options: ["Сразу после постройки", "В начале XX века", "Только при реконструкции 2001–2002 годов"],
    answer: 1,
    note: "В начале XX века башня утратила своё прямое назначение. После реконструкции 2001–2002 годов в ней разместился музей «Мир воды Санкт-Петербурга».",
    source: { title: "Энциклопедия СПб, статьи «Главная водопроводная станция» и «Водонапорные башни» (раздел «Статьи» на странице)", url: ENC },
  },
];

// проверка данных: битый вопрос заметен в консоли сразу
QUESTIONS.forEach((x, i) => console.assert(
  x.options.length >= 3 && x.options.length <= 4 && x.options[x.answer] && x.source.url,
  "Вопрос " + (i + 1) + " собран неверно"));

const app = document.getElementById("app");
const title = document.getElementById("title");
let i = 0, score = 0;

function el(tag, attrs = {}, text = "") {
  const n = Object.assign(document.createElement(tag), attrs);
  if (text) n.textContent = text;
  return n;
}

function start() {
  i = 0; score = 0;
  title.textContent = "Водонапорная башня на Шпалерной, 56";
  app.replaceChildren(
    el("p", {}, `${QUESTIONS.length} вопросов об этой башне, примерно на 2–3 минуты. После каждого ответа покажем, откуда известен факт.`),
    Object.assign(el("button", { className: "primary" }, "Начать"), { onclick: show }),
  );
}

function show() {
  const x = QUESTIONS[i];
  const buttons = x.options.map((text, k) =>
    Object.assign(el("button", {}, text), { onclick: () => pick(k, buttons) }));
  title.textContent = `Вопрос ${i + 1} из ${QUESTIONS.length}`;
  app.replaceChildren(
    el("p", { className: "question" }, x.q),
    ...buttons,
  );
  buttons[0].focus();
}

function pick(k, buttons) {
  const x = QUESTIONS[i], right = k === x.answer;
  if (right) score++;
  buttons.forEach((b, n) => {
    b.disabled = true;
    if (n === x.answer) b.classList.add("right");
    else if (n === k) b.classList.add("wrong");
  });
  const link = el("a", { href: x.source.url, target: "_blank", rel: "noopener" }, x.source.title);
  const src = el("p", { className: "muted" }, "Источник: ");
  src.append(link);
  const last = i === QUESTIONS.length - 1;
  const next = Object.assign(el("button", { className: "primary" }, last ? "Узнать результат" : "Дальше"),
    { onclick: () => { i++; last ? finish() : show(); } });
  const verdict = el("p", { className: "verdict " + (right ? "ok" : "no") }, right ? "Верно" : "Неверно");
  Field.pulse(undefined, undefined, right ? 6 : 3);
  if (!right) verdict.append(el("span", {}, "Правильный ответ: " + x.options[x.answer]));
  app.append(
    verdict,
    el("p", {}, x.note),
    src,
    next,
  );
  next.focus();
}

function finish() {
  const again = Object.assign(el("button", { className: "primary" }, "Пройти ещё раз"), { onclick: start });
  title.textContent = "Результат";
  app.replaceChildren(
    el("p", { className: "score" }, `${score} из ${QUESTIONS.length}`),
    el("p", { className: "muted" }, "Факты взяты из Энциклопедии Санкт-Петербурга и журнала «Зодчий» 1878 года."),
    again,
  );
  again.focus();
}

Field.mount(document.body);
Field.mode("dark");
start();
</script>
</body>
</html>
